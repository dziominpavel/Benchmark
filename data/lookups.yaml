# Справочники агентов и компаний для бенчмарка
#
# Допустимые значения полей agent и provider реестра data/models.yaml:
#   agents:    агент-обёртка, под которой гонялась модель
#   providers: компания-разработчик модели
#
# Порядок значений в файле задаёт порядок вывода в таблицах справочников,
# выпадающих списках форм и других местах выбора значения. Новые значения
# добавляются в конец списка. Файл можно править вручную: значения реестра,
# которых нет в справочнике, остаются допустимыми и помечаются «вне справочника»
# в консоли (Настройки → Справочники).
#
# Управление справочником (добавить/переименовать/удалить) — секция
# «Справочники» страницы /settings; новые значения при регистрации модели
# автоматически добавляет tools/register_model.py.

agents:
  - Codex
  - Cursor
  - Devin
  - OpenCode

providers:
  - Ant Group
  - Anthropic
  - Cognition
  - DeepSeek
  - Google
  - Meituan
  - Meta
  - MiniMax
  - Moonshot AI
  - NVIDIA
  - OpenAI
  - Reflection AI
  - SpaceXAI
  - StepFun
  - Unknown
  - Xiaomi
  - Z.ai
